<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Unlucky 32 (+ 1)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HERO — replace images/property.jpg with the actual photo -->
  <section class="hero" id="top">
    <div class="hero-bg">
      <img src="images/property.jpg" alt="The Building" class="hero-photo">
      <div class="hero-overlay"></div>
    </div>
    <!-- Fog layers -->
    <div class="fog-wrap" aria-hidden="true">
      <div class="fog fog-1"></div>
      <div class="fog fog-2"></div>
      <div class="fog fog-3"></div>
      <div class="fog fog-4"></div>
    </div>
    <div class="hero-content">
      <p class="hero-eyebrow">San Francisco, CA</p>
      <h1>The Unlucky 32 (+ 1)</h1>
      <p class="hero-sub" id="heroSub">Loading...</p>
    </div>
    <a href="#flags" class="hero-scroll" aria-label="Scroll to flags">
      <span>See the flags</span>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M9 3v12M3 9l6 6 6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </section>

  <!-- FLAGS -->
  <section class="flags-section" id="flags">
    <!-- Skyline background — replace images/skyline.jpg with your own SF photo -->
    <div class="section-bg" aria-hidden="true">
      <img src="images/skyline.jpg" alt="" class="section-bg-img">
      <div class="section-bg-overlay"></div>
    </div>
    <div class="container">
      <div class="section-header">
        <h2>The Teams</h2>
        <p>Tap a flag to find out why it's here.</p>
      </div>
      <div class="flags-grid" id="flagsGrid"></div>
    </div>
  </section>

  <!-- QUIZ -->
  <section class="quiz-section" id="quiz">
    <div class="container">
      <div class="section-header">
        <h2>Know Your Flags?</h2>
        <p id="quizSub">See if you can name all 32.</p>
      </div>
      <div class="quiz-container" id="quizContainer">
        <button class="btn-primary" id="quizStartBtn">Start Quiz</button>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p id="footerText">Flying above San Francisco &middot; 2026 FIFA World Cup</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
